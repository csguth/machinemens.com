{{ define "main" }}
  <main class="w-full max-w-md md:max-w-2xl lg:max-w-4xl flex flex-col items-center px-6 pb-16 pt-6 md:pt-8">
    <h1 class="w-full text-gold text-xs font-bold tracking-widest uppercase mb-4">{{ i18n "contact_page_title" }}</h1>

    <p class="w-full text-cream/80 mb-6 md:mb-8">{{ i18n "contact_page_intro" }}</p>

    <nav class="w-full grid grid-cols-1 sm:grid-cols-2 gap-3 md:gap-4 mb-10 md:mb-12" aria-label="Bookings and contact">
      <a href="mailto:info@ampsbookings.com" class="link-card">
        <span class="link-card-cover link-card-cover-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M6.75 2.25A.75.75 0 0 1 7.5 3v1.5h9V3a.75.75 0 0 1 1.5 0v1.5h.75a3 3 0 0 1 3 3v11.25a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3V7.5a3 3 0 0 1 3-3H6V3a.75.75 0 0 1 .75-.75Zm13.5 9a1.5 1.5 0 0 0-1.5-1.5H5.25a1.5 1.5 0 0 0-1.5 1.5v7.5a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5v-7.5Z"/></svg>
        </span>
        <span class="link-card-text">
          <span class="link-card-title">{{ i18n "bookings_title" }}</span>
          <span class="link-card-subtitle">{{ i18n "bookings_subtitle" }}</span>
        </span>
      </a>

      <a href="mailto:contact@machinemens.com" class="link-card">
        <span class="link-card-cover link-card-cover-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false"><path d="M1.5 6.75A2.25 2.25 0 0 1 3.75 4.5h16.5a2.25 2.25 0 0 1 2.25 2.25v10.5a2.25 2.25 0 0 1-2.25 2.25H3.75a2.25 2.25 0 0 1-2.25-2.25V6.75Zm2.4-.75 7.727 5.795a.75.75 0 0 0 .846 0L20.1 6H3.9Zm16.85 1.393-7.107 5.33a2.25 2.25 0 0 1-2.686 0L3.75 7.393v9.857c0 .414.336.75.75.75h15a.75.75 0 0 0 .75-.75V7.393Z"/></svg>
        </span>
        <span class="link-card-text">
          <span class="link-card-title">{{ i18n "contact_title" }}</span>
          <span class="link-card-subtitle">contact@machinemens.com</span>
        </span>
      </a>
    </nav>

    <section class="w-full" aria-labelledby="contact-form-heading"
             x-data="{
               name: '', email: '', subject: '', message: '',
               status: 'idle',
               async submit() {
                 if (this.status === 'sending') return;
                 this.status = 'sending';
                 try {
                   const res = await fetch('https://formspree.io/f/REPLACE_WITH_YOUR_FORMSPREE_ID', {
                     method: 'POST',
                     headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                     body: JSON.stringify({ name: this.name, email: this.email, subject: this.subject, message: this.message })
                   });
                   this.status = res.ok ? 'success' : 'error';
                 } catch {
                   this.status = 'error';
                 }
               }
             }">
      <p id="contact-form-heading" class="text-gold text-xs font-bold tracking-widest uppercase mb-4">{{ i18n "contact_form_title" }}</p>

      <template x-if="status === 'success'">
        <p class="text-cream/80 text-sm py-4">{{ i18n "contact_form_success" }}</p>
      </template>

      <template x-if="status !== 'success'">
        <form @submit.prevent="submit" novalidate class="flex flex-col gap-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="flex flex-col gap-1">
              <label for="contact-name" class="text-cream/70 text-xs font-semibold tracking-wide">{{ i18n "contact_form_name" }}</label>
              <input id="contact-name" type="text" name="name" autocomplete="name" required
                     x-model="name"
                     placeholder="{{ i18n "contact_form_name_placeholder" }}"
                     class="contact-input" />
            </div>
            <div class="flex flex-col gap-1">
              <label for="contact-email" class="text-cream/70 text-xs font-semibold tracking-wide">{{ i18n "contact_form_email" }}</label>
              <input id="contact-email" type="email" name="email" autocomplete="email" required
                     x-model="email"
                     placeholder="{{ i18n "contact_form_email_placeholder" }}"
                     class="contact-input" />
            </div>
          </div>

          <div class="flex flex-col gap-1">
            <label for="contact-subject" class="text-cream/70 text-xs font-semibold tracking-wide">{{ i18n "contact_form_subject" }}</label>
            <input id="contact-subject" type="text" name="subject"
                   x-model="subject"
                   placeholder="{{ i18n "contact_form_subject_placeholder" }}"
                   class="contact-input" />
          </div>

          <div class="flex flex-col gap-1">
            <label for="contact-message" class="text-cream/70 text-xs font-semibold tracking-wide">{{ i18n "contact_form_message" }}</label>
            <textarea id="contact-message" name="message" rows="5" required
                      x-model="message"
                      placeholder="{{ i18n "contact_form_message_placeholder" }}"
                      class="contact-input resize-none"></textarea>
          </div>

          <template x-if="status === 'error'">
            <p class="text-red-400 text-sm">{{ i18n "contact_form_error" }}</p>
          </template>

          <button type="submit" class="listen-get-btn self-start" :disabled="status === 'sending'">
            <span x-text="status === 'sending' ? '{{ i18n "contact_form_sending" }}' : '{{ i18n "contact_form_send" }}'"></span>
          </button>
        </form>
      </template>
    </section>
  </main>
{{ end }}
