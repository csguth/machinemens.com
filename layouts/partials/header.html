  <div id="env-banner" class="w-full text-center text-sm font-semibold py-2 bg-amber-500 text-black">
    STAGING
  </div>

  <header class="w-full max-w-md md:max-w-2xl lg:max-w-4xl flex items-center justify-between px-4 pt-4 gap-4">
    <nav class="flex gap-4 text-sm font-semibold" aria-label="Site navigation">
      <a href="{{ "/" | relLangURL }}" class="site-nav-link"{{ if .IsHome }} aria-current="page"{{ end }}>{{ i18n "nav_home" }}</a>
      <a href="{{ "/music/" | relLangURL }}" class="site-nav-link"{{ if eq .Section "music" }} aria-current="page"{{ end }}>{{ i18n "nav_music" }}</a>
      <a href="{{ "/shows/" | relLangURL }}" class="site-nav-link"{{ if eq .Section "shows" }} aria-current="page"{{ end }}>{{ i18n "nav_shows" }}</a>
      <a href="https://machinemens.bandcamp.com/" class="site-nav-link" target="_blank" rel="noopener noreferrer">{{ i18n "nav_shop" }}</a>
      <a href="{{ "/contact/" | relLangURL }}" class="site-nav-link"{{ if eq .Section "contact" }} aria-current="page"{{ end }}>{{ i18n "nav_contact" }}</a>
    </nav>
    {{- $flags := dict "en" "🇬🇧" "nl" "🇳🇱" "pt" "🇧🇷" }}
    <div class="relative" x-data="{ open: false }" @click.outside="open = false" @keydown.escape.window="open = false">
      <button type="button" @click="open = !open" :aria-expanded="open.toString()" aria-haspopup="listbox" class="lang-switcher-btn" aria-label="{{ i18n "language_selector" }}">
        <span aria-hidden="true">{{ index $flags .Language.Lang }}</span>
        <svg class="w-3 h-3" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div x-show="open" x-cloak class="lang-switcher-menu" role="listbox" aria-label="{{ i18n "language_selector" }}">
{{- range .AllTranslations }}
        <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" role="option" @click="open = false" class="lang-switcher-item{{ if eq .Language.Lang $.Language.Lang }} is-active{{ end }}"{{ if eq .Language.Lang $.Language.Lang }} aria-current="true"{{ end }}>
          <span aria-hidden="true">{{ index $flags .Language.Lang }}</span>
          <span>{{ .Language.LanguageName }}</span>
        </a>
{{- end }}
      </div>
    </div>
  </header>
