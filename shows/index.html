<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Machinemens — Shows</title>
  <meta name="description" content="Machinemens - upcoming shows and tour dates." />
  <link rel="canonical" href="__SITE_URL__/shows/" />

  <meta property="og:title" content="Machinemens — Shows" />
  <meta property="og:description" content="Machinemens - upcoming shows and tour dates." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="__SITE_URL__/shows/" />
  <meta property="og:image" content="__SITE_URL__/images/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:site_name" content="Machinemens" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="nl_NL" />
  <meta property="og:locale:alternate" content="pt_BR" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Machinemens — Shows" />
  <meta name="twitter:description" content="Machinemens - upcoming shows and tour dates." />
  <meta name="twitter:image" content="__SITE_URL__/images/og-image.jpg" />

  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#000000" />

  <link rel="icon" type="image/png" href="/images/logo.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <link rel="stylesheet" href="/css/site.css" />
</head>
<body data-env="__ENV_LABEL__" x-data="langToggle()" x-init="init()" class="bg-black text-cream min-h-screen flex flex-col items-center">

  <div class="hero-bg" aria-hidden="true"></div>

  <div id="env-banner" class="w-full text-center text-sm font-semibold py-2 bg-amber-500 text-black">
    STAGING
  </div>

  <header class="w-full max-w-md md:max-w-2xl lg:max-w-4xl flex items-center justify-between px-4 pt-4 gap-4">
    <nav class="flex gap-4 text-sm font-semibold" aria-label="Site navigation">
      <a href="/" class="site-nav-link">
        <span class="en">Home</span><span class="nl">Home</span><span class="pt">Início</span>
      </a>
      <a href="/music/" class="site-nav-link">
        <span class="en">Music</span><span class="nl">Muziek</span><span class="pt">Música</span>
      </a>
      <a href="/shows/" class="site-nav-link" aria-current="page">
        <span class="en">Shows</span><span class="nl">Shows</span><span class="pt">Shows</span>
      </a>
    </nav>
    <div class="flex gap-1 text-xs font-semibold tracking-wide" role="group" aria-label="Language selector">
      <button type="button" @click="lang = 'en'" :class="lang === 'en' ? 'text-gold border-gold' : 'text-cream/50 border-transparent'" class="px-2 py-1 border rounded">EN</button>
      <button type="button" @click="lang = 'nl'" :class="lang === 'nl' ? 'text-gold border-gold' : 'text-cream/50 border-transparent'" class="px-2 py-1 border rounded">NL</button>
      <button type="button" @click="lang = 'pt'" :class="lang === 'pt' ? 'text-gold border-gold' : 'text-cream/50 border-transparent'" class="px-2 py-1 border rounded">PT</button>
    </div>
  </header>

  <main class="w-full max-w-md md:max-w-2xl lg:max-w-4xl flex flex-col items-center px-6 pb-16 pt-6 md:pt-8" x-data="showsPage()">
    <h1 class="en sr-only">Shows</h1>
    <h1 class="nl sr-only">Shows</h1>
    <h1 class="pt sr-only">Shows</h1>

    <p class="en w-full text-gold text-xs font-bold tracking-widest uppercase mb-4">Upcoming shows</p>
    <p class="nl w-full text-gold text-xs font-bold tracking-widest uppercase mb-4">Komende shows</p>
    <p class="pt w-full text-gold text-xs font-bold tracking-widest uppercase mb-4">Próximos shows</p>

    <section class="w-full flex flex-col gap-4 mb-10 md:mb-12" aria-label="Upcoming shows">
      <template x-if="upcoming.length === 0">
        <p class="text-cream/60 text-sm">
          <span class="en">No shows scheduled at the moment. Check back soon.</span>
          <span class="nl">Momenteel geen shows gepland. Kom snel terug.</span>
          <span class="pt">Nenhum show agendado no momento. Volte em breve.</span>
        </p>
      </template>
      <template x-for="show in upcoming" :key="show.id">
        <article class="show-card">
          <p class="show-card-date" x-text="formatDate(show.date)"></p>
          <h2 class="show-card-title" x-text="show.title"></h2>
          <p class="show-card-venue" x-text="show.venue + ' — ' + show.address"></p>
          <template x-if="show.ticketUrl">
            <a :href="show.ticketUrl" target="_blank" rel="noopener noreferrer" class="listen-get-btn mt-1 self-start">
              <span class="en">Tickets</span>
              <span class="nl">Tickets</span>
              <span class="pt">Ingressos</span>
            </a>
          </template>
        </article>
      </template>
    </section>

    <template x-if="past.length > 0">
      <div class="w-full">
        <p class="en w-full text-gold text-xs font-bold tracking-widest uppercase mb-4">Past shows</p>
        <p class="nl w-full text-gold text-xs font-bold tracking-widest uppercase mb-4">Eerdere shows</p>
        <p class="pt w-full text-gold text-xs font-bold tracking-widest uppercase mb-4">Shows anteriores</p>
        <h2 class="sr-only">Past shows</h2>

        <section class="w-full flex flex-col gap-4 mb-4" aria-label="Past shows">
          <template x-for="show in past" :key="show.id">
            <article class="show-card is-past">
              <p class="show-card-date" x-text="formatDate(show.date)"></p>
              <h2 class="show-card-title" x-text="show.title"></h2>
              <p class="show-card-venue" x-text="show.venue + ' — ' + show.address"></p>
            </article>
          </template>
        </section>
      </div>
    </template>
  </main>

  <footer class="w-full max-w-md md:max-w-2xl lg:max-w-4xl text-center text-xs text-cream/40 pb-8">
    <span>&copy; <span id="year"></span> Machinemens</span>
  </footer>

  <script src="/js/shows-page.js"></script>
  <script src="/js/lang-toggle.js"></script>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
