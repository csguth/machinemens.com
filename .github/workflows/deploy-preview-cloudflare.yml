name: Deploy PR Preview (Cloudflare Pages)

# Automatically deploys every pull request targeting `staging` to its own
# isolated Cloudflare Pages preview URL so a branch can be tested live before
# merging — without touching staging.machinemens.com or main. Each PR gets a
# stable `pr-<number>` preview that is re-deployed on every push, and the URL
# is posted back as a sticky PR comment.
#
# This mirrors the build of deploy-staging-cloudflare.yml and shares the same
# `staging` environment config/secrets, so preview data is not isolated from
# other staging testing.
#
# Uses `pull_request` (not `pull_request_target`) so repository secrets are
# only available to branches pushed to this repo, never to untrusted forks.
on:
  pull_request:
    branches: [staging]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate variables
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Missing environment variable: SITE_URL"
            exit 1
          fi

      - name: Build site with injected variables
        run: |
          mkdir -p site
          rsync -av --exclude=".git" --exclude=".github" --exclude="site" ./ site/

          while IFS= read -r -d '' f; do
            sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" "$f"
            sed -i "s|__ENV_LABEL__|${{ vars.ENV_LABEL }}|g" "$f"
          done < <(find site -name "*.html" -print0)

          sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" site/robots.txt
          sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" site/sitemap.xml

      - name: Deploy to Cloudflare Pages (staging project, PR preview)
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          projectName: machinemens-com-staging
          directory: site
          # A stable, per-PR preview branch so every push to the PR re-deploys the
          # same isolated preview (never the real `staging` branch/URL).
          branch: pr-${{ github.event.pull_request.number }}

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = ${{ toJSON(steps.deploy.outputs.url) }};
            const marker = '<!-- cloudflare-pr-preview -->';
            const body = [
              marker,
              '### 🚀 Cloudflare Pages preview',
              '',
              `Preview desta PR: ${url}`,
              '',
              `Commit: \`${context.sha.slice(0, 7)}\``,
              '',
              '> ⚠️ Compartilha o projeto/config de **staging** — dados/config aqui não ficam isolados de outros testes de staging.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
