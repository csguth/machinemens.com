name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate variables
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Missing repository/environment variable: SITE_URL"
            exit 1
          fi

      - name: Build site with injected variables
        run: |
          mkdir -p site
          rsync -av --exclude=".git" --exclude=".github" --exclude="site" ./ site/

          for f in site/index.html; do
            sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" "$f"
            sed -i "s|__ENV_LABEL__|${{ vars.ENV_LABEL }}|g" "$f"
          done

          sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" site/robots.txt
          sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" site/sitemap.xml

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4