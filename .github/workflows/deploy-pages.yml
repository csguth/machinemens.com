name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate variables
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          PAYPAL_CLIENT_ID: ${{ vars.PAYPAL_CLIENT_ID }}
          CHECKOUT_API_URL: ${{ vars.CHECKOUT_API_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Missing repository/environment variable: SITE_URL"
            exit 1
          fi
          if [ -z "$PAYPAL_CLIENT_ID" ]; then
            echo "Missing repository/environment variable: PAYPAL_CLIENT_ID"
            exit 1
          fi
          if [ -z "$CHECKOUT_API_URL" ]; then
            echo "Missing repository/environment variable: CHECKOUT_API_URL"
            exit 1
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.148.1'
          extended: true

      - name: Build site with Hugo and inject variables
        run: |
          hugo --gc --minify

          while IFS= read -r -d '' f; do
            sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" "$f"
            sed -i "s|__ENV_LABEL__|${{ vars.ENV_LABEL }}|g" "$f"
            sed -i "s|__PAYPAL_CLIENT_ID__|${{ vars.PAYPAL_CLIENT_ID }}|g" "$f"
            sed -i "s|__CHECKOUT_API_URL__|${{ vars.CHECKOUT_API_URL }}|g" "$f"
          done < <(find site -name "*.html" -print0)

          sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" site/robots.txt
          sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" site/sitemap.xml

      - name: Minify static JS
        # hugo --minify only touches rendered HTML/CSS; static/js/*.js is copied
        # verbatim. Minify the *build output* only (never static/js/ sources),
        # via npx so the repo stays zero-build (no package.json/node_modules).
        run: |
          for f in site/js/*.js; do
            npx --yes terser@5 "$f" --compress --mangle -o "$f"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4