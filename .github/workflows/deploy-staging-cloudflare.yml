name: Deploy Staging (Cloudflare Pages)

# Deploys the real `staging` branch to staging.machinemens.com. Per-PR preview
# deploys are handled separately by deploy-preview-cloudflare.yml, which never
# touches this branch/URL.
on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-staging-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate variables
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "$SITE_URL" ]; then
            echo "Missing environment variable: SITE_URL"
            exit 1
          fi

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.148.1'
          extended: true

      - name: Build site with Hugo and inject variables
        run: |
          hugo --gc --minify

          while IFS= read -r -d '' f; do
            sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" "$f"
            sed -i "s|__ENV_LABEL__|${{ vars.ENV_LABEL }}|g" "$f"
          done < <(find site -name "*.html" -print0)

          sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" site/robots.txt
          sed -i "s|__SITE_URL__|${{ vars.SITE_URL }}|g" site/sitemap.xml

      - name: Deploy to Cloudflare Pages (staging project)
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          projectName: machinemens-com-staging
          directory: site
          branch: staging